name: Build, test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify including headless UI on Linux
        if: runner.os == 'Linux'
        run: mvn -B -ntp -Pheadless verify
      - name: Verify core on Windows and macOS
        if: runner.os != 'Linux'
        run: mvn -B -ntp verify
      - name: Package current OS and bundled-runtime image
        run: python scripts/package.py --native
      - uses: actions/upload-artifact@v4
        with:
          name: SQLNext-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/SQLNext-*.zip
            target/SQLNext-*.tar.gz
